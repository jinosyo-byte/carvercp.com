<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카버 | CNC 맞춤기계 제작 전문기업</title>
    <meta name="description" content="카버는 정밀 CNC 가공과 맞춤 제작을 전문으로 하는 기업입니다.">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 기본 레이아웃 */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #333;
        }

        /* 추가 반응형 및 커스텀 스타일 */
        .service-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }
        .service-card {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #eee;
        }
        .hero {
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('images/hero.jpg');
            background-size: cover;
            background-position: center;
        }

        /* 문의 게시판 및 모바일 전용 반응형 스타일 */
        .contact-section-custom {
            background-color: #f8f9fa !important;
            padding: 80px 20px !important;
        }
        .contact-card {
            max-width: 760px !important;
            margin: 0 auto !important;
            background: #ffffff !important;
            padding: 40px !important;
            border-radius: 12px !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05) !important;
            border: 1px solid #e9ecef !important;
            box-sizing: border-box !important;
        }

        .form-row {
            display: flex !important;
            gap: 16px !important;
            margin-bottom: 20px !important;
        }
        .form-col {
            flex: 1 !important;
            display: flex !important;
            flex-direction: column !important;
        }
        .form-col-full {
            margin-bottom: 20px !important;
            display: flex !important;
            flex-direction: column !important;
        }
        .form-label-custom {
            font-size: 14px !important;
            font-weight: 600 !important;
            color: #333 !important;
            margin-bottom: 8px !important;
            display: block !important;
            text-align: left !important;
        }
        .input-custom, .textarea-custom {
            width: 100% !important;
            padding: 12px 16px !important;
            border: 1px solid #ced4da !important;
            border-radius: 6px !important;
            font-size: 14px !important;
            box-sizing: border-box !important;
            outline: none !important;
            transition: border-color 0.2s, box-shadow 0.2s !important;
            background-color: #fff !important;
            color: #333 !important;
            -webkit-appearance: none !important;
        }
        .input-custom:focus, .textarea-custom:focus {
            border-color: #111 !important;
            box-shadow: 0 0 0 3px rgba(0,0,0,0.05) !important;
        }
        .btn-submit-custom {
            width: 100% !important;
            padding: 16px !important;
            background-color: #111111 !important;
            color: #ffffff !important;
            border: none !important;
            border-radius: 6px !important;
            font-size: 16px !important;
            font-weight: 700 !important;
            cursor: pointer !important;
            transition: background-color 0.2s !important;
        }
        .btn-submit-custom:hover {
            background-color: #4f4d4d !important;
        }
        .memo-divider {
            margin: 40px 0 30px 0 !important;
            border: 0 !important;
            border-top: 2px solid #f1f3f5 !important;
        }
        .admin-header-custom {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            margin-bottom: 20px !important;
            flex-wrap: wrap !important;
            gap: 12px !important;
        }
        .admin-header-custom h3 {
            margin: 0 !important;
            font-size: 18px !important;
            font-weight: 700 !important;
            color: #111 !important;
        }

        /* 모바일 디바이스(768px 이하) 대응 스타일 */
        @media (max-width: 768px) {
            .service-grid { grid-template-columns: 1fr; }
            .contact-section-custom { padding: 50px 15px !important; }
            .contact-card { padding: 24px 16px !important; border-radius: 10px !important; }
            .form-row { flex-direction: column !important; gap: 16px !important; margin-bottom: 16px !important; }
            .admin-header-custom { flex-direction: column !important; align-items: flex-start !important; }
            .admin-header-custom #adminAuthArea { width: 100% !important; justify-content: space-between !important; }
            .admin-header-custom #adminAuthArea input { flex: 1 !important; }
        }

        /* 푸터 스타일 */
        footer {
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
        }
        footer h3 {
            margin: 0 0 8px 0;
            font-size: 18px;
            letter-spacing: 1.5px;
        }
        footer p {
            margin: 4px 0;
            color: #888888;
            font-size: 13px;
        }
        .counter-box {
            margin: 18px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- 헤더 영역 -->
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid #eee;">
        <h1 style="margin: 0; font-size: 24px; letter-spacing: 2px;">CARVER</h1>
        <nav style="display: flex; gap: 20px; font-weight: bold; font-size: 14px;">
            <a href="#about" style="text-decoration: none; color: #333;">회사소개</a>
            <a href="#business" style="text-decoration: none; color: #333;">사업소개</a>
            <a href="#products" style="text-decoration: none; color: #333;">제품소개</a>
            <a href="#portfolio" style="text-decoration: none; color: #333;">포트폴리오</a>
            <a href="#contact" style="text-decoration: none; color: #333;">문의하기</a>
        </nav>
    </header>

    <!-- 문의하기 섹션 -->
    <section id="contact" class="contact-section-custom">
        <div class="contact-card">
            <h2 style="text-align: center; margin-bottom: 30px; font-size: 22px;">문의 남기기 (비공개)</h2>
            
            <form style="display: flex; flex-direction: column;">
                <div class="form-col-full">
                    <label class="form-label-custom">문의 내용 *</label>
                    <textarea class="textarea-custom" rows="5" placeholder="가공 규격, 작업 크기, 원하시는 사양을 남겨주세요."></textarea>
                </div>
                <button type="button" class="btn-submit-custom">문의 남기기 (비공개)</button>
            </form>

            <hr class="memo-divider">

            <div class="admin-header-custom">
                <h3>등록된 문의 목록</h3>
                <div id="adminAuthArea" style="display: flex; gap: 8px;">
                    <input type="password" class="input-custom" placeholder="관리자 비밀번호" style="width: 140px; padding: 8px 12px !important;">
                    <button type="button" class="btn-submit-custom" style="padding: 8px 16px !important; font-size: 13px !important; width: auto !important;">관리자 확인</button>
                </div>
            </div>
            
            <p style="text-align: center; color: #999; margin: 40px 0; font-size: 14px;">등록된 문의 내역이 없습니다.</p>
        </div>
    </section>

    <!-- 푸터 영역 (실시간 방문자 수 카운터 적용) -->
    <footer>
        <h3>CARVER</h3>
        <p>CNC 맞춤 제작 전문기업 카버</p>

        <!-- 실시간 방문자 카운터 뱃지 -->
        <div class="counter-box">
            <img src="https://hits.seeyoufarm.com/api/count/incr/badge.svg?url=https%3A%2F%2Fcarvercp.com&count_bg=%23333333&title_bg=%23555555&icon=&icon_color=%23E7E7E7&title=VISITORS&edge_flat=false" alt="실시간 방문자 수 카운터">
        </div>

        <p style="color: #555555; font-size: 12px; margin-top: 10px;">© 2026 CARVER. All Rights Reserved.</p>
    </footer>

</body>
</html>
